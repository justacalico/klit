name: klit
description: "E621 compatible Flutter app with iOS-style design"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  pull_to_refresh: ^2.0.0
  uuid: ^4.4.0
  video_player: ^2.8.0
  chewie: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
