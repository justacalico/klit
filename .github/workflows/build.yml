name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a nightly release from this build (leave unchecked for plain branch builds)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: false
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            artifact: kilt-android
          - target: linux-x64
            os: ubuntu-latest
            artifact: kilt-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            artifact: kilt-linux-arm64
          - target: windows
            os: windows-latest
            artifact: kilt-windows
          - target: macos
            os: macos-latest
            artifact: kilt-macos
          - target: ios
            os: macos-latest
            artifact: kilt-ios

    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      build_date: ${{ steps.version.outputs.build_date }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        if: matrix.target != 'linux-arm64'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Flutter manually (ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Linux build dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libmpv-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            dpkg-dev rpm wget file squashfs-tools patchelf libfuse2
          flutter config --enable-linux-desktop

      - name: Install appimagetool (x64)
        if: matrix.target == 'linux-x64'
        run: |
          wget -q -O /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Install appimagetool (arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          wget -q -O /tmp/appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage"
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Setup Android signing
        id: signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KLIT_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KLIT_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KLIT_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KLIT_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "No keystore configured, using debug signing"
            exit 0
          fi

          echo "Setting up release signing..."
          STORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r')
          KEY_PASSWORD=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r')
          KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r')

          mkdir -p android/keystore android/app/keystore
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/keystore/upload-keystore.jks 2>/dev/null; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "Keystore base64 is invalid, using debug signing"
            exit 0
          fi
          cp android/keystore/upload-keystore.jks android/app/keystore/upload-keystore.jks
          KEYSTORE_ABS_PATH="$PWD/android/keystore/upload-keystore.jks"

          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=$KEYSTORE_ABS_PATH" > android/key.properties
          cp android/key.properties android/app/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"
          echo "Release signing is configured"

      - name: Validate Android keystore
        if: matrix.target == 'android' && steps.signing.outputs.signing == 'release'
        run: |
          set -euo pipefail
          STORE_PASSWORD=$(grep '^storePassword=' android/key.properties | cut -d'=' -f2-)
          KEY_PASSWORD=$(grep '^keyPassword=' android/key.properties | cut -d'=' -f2-)
          KEY_ALIAS=$(grep '^keyAlias=' android/key.properties | cut -d'=' -f2-)
          STORE_FILE=$(grep '^storeFile=' android/key.properties | cut -d'=' -f2-)

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_FILE" ]; then
            echo "key.properties is missing required keystore fields"
            exit 1
          fi

          if [ ! -f "$STORE_FILE" ]; then
            echo "Keystore file not found for storeFile=$STORE_FILE"
            exit 1
          fi

          echo "Validating release keystore and alias..."
          keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          echo "Android keystore validation passed"

      - name: Set macOS deployment target
        if: matrix.target == 'macos'
        run: |
          if [ -f macos/Podfile ]; then
            sed -i '' "s/platform :osx, '[^']*'/platform :osx, '11.0'/" macos/Podfile
          fi

      - name: Enable Windows Developer Mode
        if: matrix.target == 'windows'
        uses: actions/github-script@v7
        with:
          script: |
            const regKey = 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\AppModelUnlock';
            await exec.exec('reg', ['add', regKey, '/v', 'AllowDevelopmentWithoutDevLicense', '/t', 'REG_DWORD', '/d', '1', '/f']);

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
          _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS: 1
        run: |
          set -euo pipefail
          mkdir -p artifacts

          case "${{ matrix.target }}" in
            android)
              flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
              cp build/app/outputs/flutter-apk/app-release.apk \
                 "artifacts/kilt-${VERSION}-${BUILD_DATE}.apk"
              flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
              cp build/app/outputs/bundle/release/app-release.aab \
                 "artifacts/kilt-${VERSION}-${BUILD_DATE}.aab"
              ;;
            linux-x64)
              flutter build linux --release --build-name="$VERSION"
              cd build/linux/x64/release && zip -r "$GITHUB_WORKSPACE/artifacts/kilt-linux-x64-${VERSION}-${BUILD_DATE}.zip" bundle/ && cd "$GITHUB_WORKSPACE"
              export PATH="$PATH:$HOME/.pub-cache/bin"
              dart pub global activate fastforge
              timeout 300 fastforge package --platform linux --targets deb --skip-clean || echo "DEB build had warnings"
              timeout 300 fastforge package --platform linux --targets rpm --skip-clean || echo "RPM build had warnings"
              timeout 300 fastforge package --platform linux --targets appimage --skip-clean || echo "AppImage build had warnings"
              find dist -name "*.deb" -exec cp {} "artifacts/kilt-linux-amd64-${VERSION}-${BUILD_DATE}.deb" \; 2>/dev/null || true
              find dist -name "*.rpm" -exec cp {} "artifacts/kilt-linux-amd64-${VERSION}-${BUILD_DATE}.rpm" \; 2>/dev/null || true
              find dist -name "*.AppImage" -exec cp {} "artifacts/kilt-linux-x86_64-${VERSION}-${BUILD_DATE}.AppImage" \; 2>/dev/null || true
              ;;
            linux-arm64)
              flutter build linux --release --build-name="$VERSION"
              cd build/linux/arm64/release && zip -r "$GITHUB_WORKSPACE/artifacts/kilt-linux-arm64-${VERSION}-${BUILD_DATE}.zip" bundle/ && cd "$GITHUB_WORKSPACE"
              export PATH="$PATH:$HOME/.pub-cache/bin"
              export PUB_CACHE="$HOME/.pub-cache"
              dart pub global activate fastforge
              timeout 300 fastforge package --platform linux --targets deb --skip-clean || echo "DEB build had warnings"
              timeout 300 fastforge package --platform linux --targets rpm --skip-clean || echo "RPM build had warnings"
              timeout 300 fastforge package --platform linux --targets appimage --skip-clean || echo "AppImage build had warnings"
              find dist -name "*.deb" -exec cp {} "artifacts/kilt-linux-arm64-${VERSION}-${BUILD_DATE}.deb" \; 2>/dev/null || true
              find dist -name "*.rpm" -exec cp {} "artifacts/kilt-linux-arm64-${VERSION}-${BUILD_DATE}.rpm" \; 2>/dev/null || true
              find dist -name "*.AppImage" -exec cp {} "artifacts/kilt-linux-aarch64-${VERSION}-${BUILD_DATE}.AppImage" \; 2>/dev/null || true
              ;;
            windows)
              flutter build windows --release
              7z a "artifacts/kilt-windows-${VERSION}-${BUILD_DATE}.zip" "build/windows/x64/runner/Release"
              ;;
            macos)
              flutter config --enable-macos-desktop
              flutter build macos --release --build-name="$VERSION"
              ;;
            ios)
              if [ -f ios/Podfile ]; then
                sed -E -i '' "s/^[[:space:]]*# platform :ios, ['\"][^'\"]+['\"]/platform :ios, '14.0'/" ios/Podfile
                if ! grep -Eq "^[[:space:]]*platform :ios" ios/Podfile; then
                  printf "platform :ios, '14.0'\n%s" "$(cat ios/Podfile)" > ios/Podfile
                fi
              fi
              if [ -f ios/Flutter/AppFrameworkInfo.plist ]; then
                /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 14.0" ios/Flutter/AppFrameworkInfo.plist >/dev/null 2>&1 || true
              fi
              if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
                sed -E -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" ios/Runner.xcodeproj/project.pbxproj
              fi
              flutter build ios --release --no-codesign
              ;;
            *)
              echo "Unknown target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          ls -la artifacts/

      - name: Disable macOS code signing in Xcode project
        if: matrix.target == 'macos'
        run: |
          cd macos
          /usr/libexec/PlistBuddy -c "Set :buildSettings:CODE_SIGN_IDENTITY ''" Runner.xcodeproj/project.pbxproj 2>/dev/null || true
          xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath ../build/macos_unsigned || true

      - name: Create macOS ZIP
        if: matrix.target == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/artifacts/kilt-macos-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-unsigned.zip" *.app

      - name: Create iOS IPA
        if: matrix.target == 'ios'
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "artifacts/kilt-ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-unsigned.ipa" Payload/
          rm -rf Payload

      - name: Create Windows installer
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          @"
          [Setup]
          AppName=Kilt
          AppVersion=${{ steps.version.outputs.version }}
          AppPublisher=Openlyst
          DefaultDirName={autopf}\Kilt
          DefaultGroupName=Kilt
          OutputDir=artifacts
          OutputBaseFilename=kilt-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }}-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          UninstallDisplayIcon={app}\kilt.exe
          PrivilegesRequired=lowest

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Kilt"; Filename: "{app}\kilt.exe"
          Name: "{group}\{cm:UninstallProgram,Kilt}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\Kilt"; Filename: "{app}\kilt.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\kilt.exe"; Description: "{cm:LaunchProgram,Kilt}"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath installer.iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Android signature
        if: matrix.target == 'android' && steps.signing.outputs.signing == 'release'
        shell: bash
        run: |
          for pkg in artifacts/*.apk artifacts/*.aab; do
            [ -f "$pkg" ] || continue
            echo "Verifying $pkg..."
            if command -v apksigner >/dev/null 2>&1; then
              apksigner verify "$pkg" >/dev/null 2>&1 || { echo "Signature verification failed: $pkg"; exit 1; }
            else
              jarsigner -verify "$pkg" >/dev/null 2>&1 || { echo "Signature verification failed: $pkg"; exit 1; }
            fi
            echo "Verified: $pkg"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/pull/') && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)) }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_DATE=$(date +%Y-%m-%d)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.ipa" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Delete existing nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view nightly -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset nightly -R "$GITHUB_REPOSITORY" "$asset" --yes 2>/dev/null || true
            done
          fi

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from the latest commit on main.

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.version.outputs.build_date }}
            **Commit:** ${{ steps.version.outputs.short_sha }}

            > This release is automatically updated on every push to main. Artifacts are untested nightly builds.
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //g' | cut -d'+' -f1)
          BUILD_DATE=$(date +%Y-%m-%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.ipa" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kilt v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Kilt v${{ steps.version.outputs.version }}

            **Build:** #${{ github.run_number }}
            **Date:** ${{ steps.version.outputs.build_date }}
            **Commit:** ${{ github.sha }}

            ### Artifacts
            - Android: APK + AAB (release signed)
            - Linux x64: zip + deb + rpm + AppImage
            - Linux arm64: zip + deb + rpm + AppImage
            - Windows: zip + installer
            - macOS: zip (unsigned)
            - iOS: IPA (unsigned)

            ### Verification
            SHA256 checksums are in `SHA256SUMS.txt`. Verify with:
            ```
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
          files: |
            release-assets/*
            SHA256SUMS.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
